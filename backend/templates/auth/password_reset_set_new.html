<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Restablecer contraseña – {{ app_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f6f8fb; margin:0; }
      .card { max-width: 420px; margin: 8vh auto; background:#fff; border-radius:16px; box-shadow:0 10px 25px rgba(2,6,23,.08); padding:24px; }
      h1 { font-size:20px; margin:0 0 12px; }
      p { color:#475569; font-size:14px; margin:0 0 16px; }
      label { display:block; font-size:13px; color:#334155; margin-bottom:6px; }
      input[type="password"] { width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; }
      button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; font-weight:600; font-size:14px; background:#0ea5e9; color:#fff; cursor:pointer; }
      .msg { margin-top:12px; font-size:13px; }
      .ok { color:#047857; }
      .err { color:#b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Establece tu nueva contraseña</h1>
      <p>Introduce una contraseña segura para tu cuenta.</p>
      <form id="form">
        {% csrf_token %}
        <label for="pwd">Nueva contraseña</label>
        <input id="pwd" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        <button type="submit">Guardar contraseña</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <script>
      function getCookie(name) {
        const v = `; ${document.cookie}`;
        const p = v.split(`; ${name}=`);
        if (p.length === 2) return p.pop().split(';').shift();
      }

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const new_password = document.getElementById('pwd').value;
        const csrftoken = getCookie('csrftoken');

        const res = await fetch('/api/auth/password/reset/finish/', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken || ''
          },
          body: JSON.stringify({ new_password })
        });

        const box = document.getElementById('msg');
        try {
          const data = await res.json();
          if (res.ok) {
            box.textContent = data.detail || 'Contraseña restablecida.';
            box.className = 'msg ok';
          } else {
            const detail = data.detail || 'Error al restablecer.';
            const field = data.errors && data.errors.new_password ? ': ' + data.errors.new_password.join(', ') : '';
            box.textContent = detail + field;
            box.className = 'msg err';
          }
        } catch {
          box.textContent = res.ok ? 'Contraseña restablecida.' : 'Error al restablecer.';
          box.className = res.ok ? 'msg ok' : 'msg err';
        }
      });
    </script>
  </body>
</html>
