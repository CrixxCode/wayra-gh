<div class="room-overlay" (click)="closeDrawer()">
  <article class="room-drawer" (click)="$event.stopPropagation()">
    <header class="drawer-head">
      <div>
        <h1>Nueva habitación</h1>
        <p>Crea la habitación y define su piso, tipo, estado y amenidades.</p>
      </div>
      <button type="button" class="drawer-close" (click)="closeDrawer()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <form [formGroup]="roomForm" (ngSubmit)="submit()" class="drawer-body">
      <section>
        <h2>Datos base</h2>
        <div class="grid two">
          <label>
            <span>Número *</span>
            <input type="text" formControlName="number" placeholder="Ej: 101" [class.input-error]="number?.touched && number?.invalid" />
            <small class="field-error" *ngIf="number?.touched && number?.hasError('required')">El numero es obligatorio.</small>
            <small class="field-error" *ngIf="number?.touched && number?.hasError('maxlength')">El numero no puede superar 20 caracteres.</small>
          </label>

          <label>
            <span>Piso *</span>
            <select formControlName="floor" [class.input-error]="floor?.touched && floor?.invalid">
              <option [ngValue]="null">Selecciona piso</option>
              <option *ngFor="let floorItem of floors; trackBy: trackById" [ngValue]="floorItem.id">
                {{ floorItem.name }} (Piso {{ floorItem.floor_number }})
              </option>
            </select>
            <small class="field-error" *ngIf="floor?.touched && floor?.invalid">Selecciona un piso.</small>
          </label>

          <label>
            <span>Tipo de habitación</span>
            <select formControlName="room_type">
              <option [ngValue]="null">Sin tipo</option>
              <option *ngFor="let roomType of roomTypes; trackBy: trackById" [ngValue]="roomType.id">
                {{ roomType.name }}
              </option>
            </select>
          </label>

          <label>
            <span>Estado *</span>
            <select formControlName="status">
              <option *ngFor="let status of statusOptions" [ngValue]="status.value">{{ status.label }}</option>
            </select>
          </label>

          <label class="full">
            <span>Notas internas</span>
            <textarea
              rows="4"
              formControlName="notes"
              placeholder="Observaciones operativas de la habitacion..."
              [class.input-error]="roomForm.get('notes')?.touched && roomForm.get('notes')?.invalid"></textarea>
            <small class="field-error" *ngIf="roomForm.get('notes')?.touched && roomForm.get('notes')?.hasError('maxlength')">
              Las notas no pueden superar 800 caracteres.
            </small>
          </label>
        </div>
      </section>

      <section>
        <h2>Amenidades</h2>
        <div class="amenities-grid">
          <label *ngFor="let amenity of amenities; trackBy: trackById" class="amenity-option">
            <input
              type="checkbox"
              [checked]="isAmenitySelected(amenity.id)"
              (change)="toggleAmenity(amenity.id, $any($event.target).checked)"
            />
            <span class="amenity-label">
              <i [class]="amenity.icon || 'fa-solid fa-circle-check'"></i>
              <span>{{ amenity.name }}</span>
            </span>
          </label>
        </div>
      </section>

      <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <footer class="drawer-footer">
        <button type="button" class="btn btn-light" (click)="closeDrawer()" [disabled]="saving">Cancelar</button>
        <button type="submit" class="btn btn-dark" [disabled]="saving">
          {{ saving ? 'Guardando...' : 'Guardar habitación' }}
        </button>
      </footer>
    </form>
  </article>
</div>
