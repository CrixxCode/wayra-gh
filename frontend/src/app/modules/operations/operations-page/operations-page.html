<div class="ops-page">
  <header class="ops-header">
    <div class="ops-title">
      <h1>Limpieza y mantenimiento</h1>
      <p>
        El trabajo pendiente sobre las habitaciones: lo que hay que limpiar, lo que hay
        que reparar, y que habitaciones estan esperando las dos cosas.
      </p>
    </div>

    <div class="ops-header-actions">
      <!-- Generar trabajo desde cualquier pestaña: es la accion de la pantalla, no de
           una lista concreta. -->
      <button type="button" class="ops-new is-cleaning" (click)="createWork('cleaning')">
        <i class="fa-solid fa-broom"></i>
        Nueva tarea
      </button>

      <button type="button" class="ops-new is-maintenance" (click)="createWork('maintenance')">
        <i class="fa-solid fa-screwdriver-wrench"></i>
        Nueva orden
      </button>

      <!-- Lo que se repite: "cada 6 meses revisar los aires" se busca aqui, no en una
           pestaña llamada "Programado". -->
      <div class="ops-schedule">
        <button type="button" class="ops-new is-schedule" (click)="toggleScheduleMenu()">
          <i class="fa-regular fa-calendar-check"></i>
          Programar periodica
          <i class="fa-solid fa-chevron-down is-caret"></i>
        </button>

        <div class="ops-schedule-menu" *ngIf="showScheduleMenu">
          <button type="button" (click)="scheduleWork('cleaning')">
            <i class="fa-solid fa-broom"></i>
            Limpieza que se repite
          </button>
          <button type="button" (click)="scheduleWork('maintenance')">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            Mantenimiento que se repite
          </button>
        </div>
      </div>

      <button
        type="button"
        class="ops-refresh"
        (click)="loadSummary(true, true)"
        [disabled]="loading || refreshing"
        title="Actualizar">
        <i class="fa-solid fa-rotate-right" [class.is-spinning]="loading || refreshing"></i>
        Actualizar
      </button>
    </div>
  </header>

  <!-- Resumen: cada tarjeta lleva a la pestaña donde se resuelve -->
  <section class="ops-metrics" aria-label="Resumen del trabajo pendiente">
    <button
      type="button"
      class="ops-metric"
      *ngFor="let metric of metrics; trackBy: trackByMetric"
      [ngClass]="'tone-' + metric.tone"
      (click)="selectTab(metric.tab)">
      <span class="metric-icon"><i [class]="metric.icon"></i></span>
      <span class="metric-body">
        <span class="metric-label">{{ metric.label }}</span>
        <strong class="metric-value">{{ metric.value }}</strong>
        <small class="metric-note">{{ metric.note }}</small>
      </span>
    </button>
  </section>

  <nav class="ops-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="ops-tab"
      *ngFor="let tab of tabs; trackBy: trackByTab"
      [class.is-active]="activeTab === tab.key"
      [attr.aria-selected]="activeTab === tab.key"
      [title]="tab.hint"
      (click)="selectTab(tab.key)">
      <i [class]="tab.icon"></i>
      <span class="tab-label">{{ tab.label }}</span>
      <span class="tab-count">{{ tabCount(tab.key) }}</span>
    </button>
  </nav>

  <!-- Rastro de la habitacion que se viene siguiendo desde el tablero. -->
  <div class="ops-focus" *ngIf="focus">
    <span>
      <i class="fa-solid fa-crosshairs"></i>
      Viendo el trabajo de <strong>{{ focus.label }}</strong>
    </span>

    <div class="ops-focus-jumps">
      <button type="button" *ngIf="activeTab !== 'cleaning'" (click)="followRoom(focus, 'cleaning')">
        Su limpieza
      </button>
      <button type="button" *ngIf="activeTab !== 'maintenance'" (click)="followRoom(focus, 'maintenance')">
        Su mantenimiento
      </button>
      <button type="button" *ngIf="activeTab !== 'rooms'" (click)="followRoom(focus, 'rooms')">
        Volver al tablero
      </button>
      <button type="button" class="is-clear" (click)="clearFocus()" title="Dejar de seguir">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <section class="ops-panel">
    <!-- Cada lista se monta solo cuando su pestaña esta activa. -->
    <app-room-workload
      *ngIf="activeTab === 'rooms'"
      [rooms]="roomsWithWork"
      (openWork)="followRoom($event.room, $event.tab)">
    </app-room-workload>

    <app-list-cleaning-tasks
      *ngIf="activeTab === 'cleaning'"
      [embedded]="true"
      [focusRoomId]="focus?.id ?? null"
      (changed)="onWorkChanged()">
    </app-list-cleaning-tasks>

    <app-list-maintenance-orders
      *ngIf="activeTab === 'maintenance'"
      [embedded]="true"
      [focusRoomId]="focus?.id ?? null"
      (changed)="onWorkChanged()">
    </app-list-maintenance-orders>

    <app-recurring-work *ngIf="activeTab === 'scheduled'" (changed)="onWorkChanged()">
    </app-recurring-work>
  </section>
</div>
