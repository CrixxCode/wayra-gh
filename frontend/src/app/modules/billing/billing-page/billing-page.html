<div class="ledger-page">
  <header class="ledger-header">
    <div class="ledger-title">
      <h1>Facturas y pagos</h1>
      <p>
        El recorrido completo del dinero de una estancia: la factura que se emite, los
        pagos que la saldan y los reembolsos que se devuelven sobre esos pagos.
      </p>
    </div>

    <button
      type="button"
      class="ledger-refresh"
      (click)="loadSummary(true, true)"
      [disabled]="loading || refreshing"
      title="Actualizar">
      <i class="fa-solid fa-rotate-right" [class.is-spinning]="loading || refreshing"></i>
      Actualizar
    </button>
  </header>

  <!-- Resumen: cada tarjeta lleva a la pestaña donde se resuelve -->
  <section class="ledger-metrics" aria-label="Resumen de facturacion">
    <button
      type="button"
      class="ledger-metric"
      *ngFor="let metric of metrics; trackBy: trackByMetric"
      [ngClass]="'tone-' + metric.tone"
      (click)="selectTab(metric.tab)">
      <span class="metric-icon"><i [class]="metric.icon"></i></span>
      <span class="metric-body">
        <span class="metric-label">{{ metric.label }}</span>
        <strong class="metric-value">{{ metric.value }}</strong>
        <small class="metric-note">{{ metric.note }}</small>
      </span>
    </button>
  </section>

  <!-- Pestañas: las tres entidades conservan su vista completa -->
  <nav class="ledger-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="ledger-tab"
      *ngFor="let tab of visibleTabs; trackBy: trackByTab"
      [class.is-active]="activeTab === tab.key"
      [attr.aria-selected]="activeTab === tab.key"
      [title]="tab.hint"
      (click)="selectTab(tab.key)">
      <i [class]="tab.icon"></i>
      <span class="tab-label">{{ tab.label }}</span>
      <span class="tab-count">{{ tabCount(tab.key) }}</span>
    </button>
  </nav>

  <section class="ledger-panel">
    <!-- Cada lista se monta solo cuando su pestaña esta activa: montar las tres a la
         vez dispararia sus peticiones y sus animaciones sin que nadie las vea. -->
    <app-list-bill *ngIf="activeTab === 'invoices'" [embedded]="true" (changed)="onBillingChanged()">
    </app-list-bill>

    <app-list-payments
      *ngIf="activeTab === 'payments'"
      [embedded]="true"
      (changed)="onBillingChanged()">
    </app-list-payments>

    <app-list-payment-refunds
      *ngIf="activeTab === 'refunds' && canSeeRefunds"
      [embedded]="true"
      (changed)="onBillingChanged()"
      (navigateTab)="selectTab($event)">
    </app-list-payment-refunds>
  </section>
</div>
