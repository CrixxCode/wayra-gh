<div class="movement-overlay" (click)="closeDrawer()">
  <article class="movement-drawer" (click)="$event.stopPropagation()">
    <header class="drawer-head">
      <div>
        <h1>Nuevo movimiento</h1>
        <p>Registra entradas, salidas y ajustes de inventario por item.</p>
      </div>
      <button type="button" class="drawer-close" (click)="closeDrawer()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <form [formGroup]="movementForm" (ngSubmit)="submit()" class="drawer-body">
      <section>
        <h2>Datos del movimiento</h2>
        <div class="grid two">
          <label class="full">
            <span>Item *</span>
            <select formControlName="item" [class.input-error]="item?.touched && item?.invalid">
              <option [ngValue]="null">Selecciona item</option>
              <option *ngFor="let itemOption of availableItems; trackBy: trackById" [ngValue]="itemOption.id">
                {{ itemOption.name }} (Stock: {{ itemOption.stock }})
              </option>
            </select>
            <small class="field-error" *ngIf="item?.touched && item?.invalid">Selecciona un item.</small>
          </label>

          <label>
            <span>Tipo de movimiento *</span>
            <select formControlName="movement_type" [class.input-error]="movement_type?.touched && movement_type?.invalid">
              <option [ngValue]="null">Selecciona tipo</option>
              <option *ngFor="let movementType of movementTypes; trackBy: trackById" [ngValue]="movementType.id">
                {{ movementType.name }}
              </option>
            </select>
            <small class="field-error" *ngIf="movement_type?.touched && movement_type?.invalid">Selecciona un tipo.</small>
          </label>

          <label>
            <span>Cantidad *</span>
            <input
              type="number"
              min="1"
              step="1"
              formControlName="quantity"
              placeholder="Ej: 5"
              [class.input-error]="quantity?.touched && quantity?.invalid" />
            <small class="field-error" *ngIf="quantity?.touched && quantity?.hasError('required')">La cantidad es obligatoria.</small>
            <small class="field-error" *ngIf="quantity?.touched && quantity?.hasError('min')">La cantidad debe ser mayor o igual a 1.</small>
            <small class="field-hint">{{ quantityHelperText }}</small>
          </label>

          <label>
            <span>Referencia</span>
            <input
              type="text"
              formControlName="reference"
              placeholder="Ej: Factura #INV-553"
              [class.input-error]="movementForm.get('reference')?.touched && movementForm.get('reference')?.invalid" />
            <small class="field-error" *ngIf="movementForm.get('reference')?.touched && movementForm.get('reference')?.hasError('maxlength')">
              La referencia no puede superar 100 caracteres.
            </small>
          </label>

          <label class="full">
            <span>Notas</span>
            <textarea
              rows="4"
              formControlName="notes"
              placeholder="Detalle adicional del movimiento..."
              [class.input-error]="movementForm.get('notes')?.touched && movementForm.get('notes')?.invalid"></textarea>
            <small class="field-error" *ngIf="movementForm.get('notes')?.touched && movementForm.get('notes')?.hasError('maxlength')">
              Las notas no pueden superar 2000 caracteres.
            </small>
          </label>

          <label class="full switch-row">
            <input type="checkbox" formControlName="is_active" />
            <span>Movimiento activo para trazabilidad operativa</span>
          </label>
        </div>
      </section>

      <p class="feedback warning" *ngIf="!availableItems.length">
        No hay items activos para registrar movimientos.
      </p>
      <p class="feedback warning" *ngIf="!movementTypes.length">
        No hay tipos de movimiento activos en master data.
      </p>
      <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <footer class="drawer-footer">
        <button type="button" class="btn btn-light" (click)="closeDrawer()" [disabled]="saving">Cancelar</button>
        <button type="submit" class="btn btn-dark" [disabled]="saving || !availableItems.length || !movementTypes.length">
          {{ saving ? 'Guardando...' : 'Guardar movimiento' }}
        </button>
      </footer>
    </form>
  </article>
</div>
