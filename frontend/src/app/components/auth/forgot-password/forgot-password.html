<div class="fp-shell">
  <swiper-container
    class="fp-bg"
    effect="fade"
    autoplay-delay="4000"
    autoplay-disable-on-interaction="false"
    loop="true"
    speed="1500">
    <swiper-slide *ngFor="let bg of backgrounds">
      <img [src]="bg" alt="Fondo hotel" />
    </swiper-slide>
  </swiper-container>

  <div class="fp-overlay" aria-hidden="true"></div>

  <section class="fp-card" aria-label="Recuperar contrasena">
    <header class="fp-head">
      <span class="fp-chip">Recuperacion de acceso</span>
      <div class="fp-brand">
        <img src="/favicon.ico" alt="Logo Wayra" />
        <div>
          <h1>Wayra</h1>
          <p>Gestion hotelera en una sola plataforma</p>
        </div>
      </div>
      <h2>Recuperar contrasena</h2>
      <p class="fp-subtitle">Ingresa tu correo y enviaremos un enlace para restablecer tu acceso.</p>
    </header>

    <div *ngIf="message" class="fp-alert" [ngClass]="{
      'is-success': messageType === 'success',
      'is-error': messageType === 'error',
      'is-warn': messageType === 'warn'
    }">
      {{ message }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="fp-form" *ngIf="!emailSent">
      <div class="fp-field">
        <label for="email">Correo electronico</label>
        <input
          pInputText
          id="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          type="email"
          class="fp-input" />
      </div>

      <button
        pButton
        type="submit"
        label="Enviar enlace"
        [loading]="isLoading"
        class="fp-submit">
      </button>
    </form>

    <div class="fp-success-box" *ngIf="emailSent">
      <p>Si tu correo existe en el sistema, el enlace ya fue enviado.</p>
      <a routerLink="/login" class="fp-link fp-link-cta">Volver a iniciar sesion</a>
    </div>

    <div class="fp-meta" *ngIf="!emailSent">
      <a routerLink="/login" class="fp-link">Volver a iniciar sesion</a>
    </div>
  </section>
</div>
