<div class="rp-shell">
  <swiper-container
    class="rp-bg"
    effect="fade"
    autoplay-delay="4000"
    autoplay-disable-on-interaction="false"
    loop="true"
    speed="1500">
    <swiper-slide *ngFor="let bg of backgrounds">
      <img [src]="bg" alt="Fondo hotel" />
    </swiper-slide>
  </swiper-container>

  <div class="rp-overlay" aria-hidden="true"></div>

  <section class="rp-card" aria-label="Restablecer contrasena">
    <header class="rp-head">
      <span class="rp-chip">Seguridad de cuenta</span>
      <div class="rp-brand">
        <img src="/favicon.ico" alt="Logo Wayra" />
        <div>
          <h1>Wayra</h1>
          <p>Gestion hotelera en una sola plataforma</p>
        </div>
      </div>
      <h2>Establecer nueva contrasena</h2>
      <p class="rp-subtitle">Crea una contrasena segura para proteger tu cuenta.</p>
    </header>

    <div *ngIf="message" class="rp-alert" [ngClass]="{
      'is-success': messageType === 'success',
      'is-error': messageType === 'error',
      'is-warn': messageType === 'warn'
    }">
      {{ message }}
    </div>

    <form *ngIf="!success" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="rp-form">
      <div class="rp-field">
        <label for="new_password">Nueva contrasena</label>
        <p-password
          id="new_password"
          formControlName="new_password"
          [feedback]="true"
          [toggleMask]="true"
          styleClass="rp-password"
          inputStyleClass="rp-password-input"
          promptLabel="Elige una contrasena segura"
          weakLabel="Debil"
          mediumLabel="Media"
          strongLabel="Fuerte">
        </p-password>
      </div>

      <div class="rp-field">
        <label for="confirm_password">Confirmar contrasena</label>
        <p-password
          id="confirm_password"
          formControlName="confirm_password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="rp-password"
          inputStyleClass="rp-password-input"
          placeholder="Confirma la contrasena">
        </p-password>
      </div>

      <button
        pButton
        type="submit"
        label="Restablecer"
        [loading]="isLoading"
        class="rp-submit">
      </button>
    </form>

    <div class="rp-success-box" *ngIf="success">
      <p>Tu contrasena se actualizo correctamente.</p>
      <a routerLink="/login" class="rp-link rp-link-cta">Ir a iniciar sesion</a>
    </div>

    <div class="rp-meta" *ngIf="!success">
      <a routerLink="/login" class="rp-link">Cancelar</a>
    </div>
  </section>
</div>
